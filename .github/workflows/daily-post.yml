name: Daily Blog Post

on:
  schedule:
    - cron: '0 15 * * *'  # Every day at 7:00 AM PST (15:00 UTC)
  workflow_dispatch: {}   # Manual trigger

permissions:
  contents: write

# A manual run and the scheduled run must not push at the same time.
concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  generate-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            scripts/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix scripts

      - name: Unit tests
        run: npm run test:unit
        working-directory: scripts

      - name: Generate daily blog post
        run: node generate-post.mjs
        working-directory: scripts
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}

      # New posts can use Tailwind classes the compiled CSS doesn't have yet.
      - name: Build CSS
        run: npm run build:css

      - name: Commit new post
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add posts/ sitemap.xml feed.xml css/tailwind.css
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "Daily post: $(date +%Y-%m-%d)"
          git push

